<!DOCTYPE html>

<html>
    <head>
        <title> Student Registration Form </title>
    </head>


    <body background="cyan">

        <center>
        <h2> Student Registration Form </h2>
            <form>
                <label> Name: </label>
                <input type="text"> <br>

                <label> Password: </label>
                <input type="password"> <br>

                <label> Email: </label>
                <input type="email"> <br>

                <label> Age: </label>
                <input type="number"><br>

                <label> Date of Birth: </label>
                <input type="date"><br>

                <label> Time: </label>
                <input type="time"><br>

                <label> Favourite color:</label>
                <input type="color"><br>

                <lable> Skill Level </lable>
                <input type="range"> <br>

                <label> Gender: </label>
                <input type="radio" name="gender"> Male
                <input type="radio" name="gender"> Female
                <br>


                <label> Language: </label>
                <input type="checkbox"> C
                <input type="checkbox"> Java
                <input type="checkbox"> Python

                <label> Department: </label>
                <select>
                    <option>CSE</option>
                    <option>ECE</option>
                    <option>EEE</option>
                    <option>Mechanical</option>
                    <option>Civil</option>
                    <option>BME</option>
                    <option>IT</option>
                    <option>Chemical</option>
                </select>
                <br>

                <label> Address: </label>
                <textarea rows="r" cols="40"></textarea>
                <br>

                <label> City: </label>
                <input type="text">
                <br>

                <label> Resume: </label>
                <input type="file">
                <br>

                <input type="submit" value="Submit">
            </form>
        </center>
    </body>
</html>
