<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whack-a-Mole Game</title>

<style>

body{
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;
    background:#f4f4f4;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:100vh;
}

h1{
    margin-bottom:10px;
}

.info{
    display:flex;
    gap:30px;
    margin-bottom:20px;
    font-size:20px;
    font-weight:bold;
}

.board{
    display:grid;
    grid-template-columns:repeat(3,100px);
    gap:15px;
}

.hole{
    width:100px;
    height:100px;
    background:brown;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:45px;
    cursor:pointer;
    user-select:none;
}

button{
    margin-top:20px;
    padding:10px 25px;
    font-size:18px;
    cursor:pointer;
}

</style>

</head>
<body>

<h1>🐹 Whack-a-Mole 🐹</h1>

<div class="info">
    <div>Score : <span id="score">0</span></div>
    <div>Miss : <span id="miss">0</span></div>
    <div>Time : <span id="time">30</span></div>
</div>

<div class="board">

    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>

    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>

    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>

</div>

<button onclick="startGame()">Start Game</button>

<script>

let holes = document.querySelectorAll(".hole");

let score = 0;
let miss = 0;
let time = 30;

let currentHole = null;
let clicked = false;

let moleTimer;
let gameTimer;

function showMole(){

    if(currentHole){

        if(!clicked){
            miss++;
            document.getElementById("miss").textContent = miss;
        }

        currentHole.textContent = "";
        currentHole.onclick = null;
    }

    clicked = false;

    let random = Math.floor(Math.random()*holes.length);

    currentHole = holes[random];

    currentHole.textContent = "🐹";

    currentHole.onclick = function(){

        if(clicked) return;

        clicked = true;

        score++;

        document.getElementById("score").textContent = score;

        currentHole.textContent = "";

        currentHole.onclick = null;
    };

}

function startGame(){

    clearInterval(moleTimer);
    clearInterval(gameTimer);

    score = 0;
    miss = 0;
    time = 30;

    document.getElementById("score").textContent = score;
    document.getElementById("miss").textContent = miss;
    document.getElementById("time").textContent = time;

    holes.forEach(function(hole){
        hole.textContent = "";
        hole.onclick = null;
    });

    showMole();

    moleTimer = setInterval(showMole,1000);

    gameTimer = setInterval(function(){

        time--;

        document.getElementById("time").textContent = time;

        if(time<=0){

            clearInterval(moleTimer);
            clearInterval(gameTimer);

            if(currentHole){
                currentHole.textContent = "";
            }

            alert(
                "Game Over!\n\n" +
                "Final Score : " + score +
                "\nMisses : " + miss
            );
        }

    },1000);

}

</script>

</body>
</html>
