<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Card Matching Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Memory Card Matching Game</h1>
    <p class="instructions">
      Click on any two cards to flip them. If they match, they stay face up.
      If they don't match, they flip back after 1 second. Match all 8 pairs to win!
    </p>
  </header>

  <main>
    <div class="game-info">
      <p id="moves">Moves: 0</p>
      <button id="restart-btn">Restart Game</button>
    </div>

    <section id="game-board" class="game-board" aria-label="Memory card grid">
      <!-- Cards are generated dynamically by script.js -->
    </section>

    <p id="status-message" class="status-message" aria-live="polite"></p>
  </main>

  <footer>
    <p>CAT Assignment 1 - Web Application Development (ICS1503)</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
